<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Kecil • Demo Laravel API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1f2a5a;
            --sky: #d6eaff;
            --paper: #ffffff;
            --lemon: #ffd84d;
            --pink: #ff9ec4;
            --mint: #8fe3bf;
            --lilac: #c9b8ff;
            --danger: #ff6b7a;
            --shadow: 4px 4px 0 var(--ink);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            padding: 32px 16px 80px;
            background-color: var(--sky);
            background-image:
                linear-gradient(rgba(255,255,255,.7) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,.7) 2px, transparent 2px);
            background-size: 32px 32px;
        }

        :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

        .wrap { max-width: 1020px; margin: 0 auto; }

        /* ---------- header ---------- */
        header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 36px;
        }

        .mascot { width: 120px; flex-shrink: 0; overflow: visible; }
        .mascot .body { fill: var(--lemon); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
        .mascot .cheek { fill: var(--pink); }
        .mascot .eye { fill: #fff; stroke: var(--ink); stroke-width: 3; }
        .mascot .pupil { fill: var(--ink); }
        .mascot .mouth { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; display: none; }
        .mascot[data-mood="happy"] .m-happy,
        .mascot[data-mood="sad"] .m-sad,
        .mascot[data-mood="load"] .m-load,
        .mascot[data-mood="idle"] .m-idle { display: block; }
        .mascot .m-load { fill: var(--ink); }
        .mascot[data-mood="happy"] { animation: hop .5s ease 2; }
        .mascot[data-mood="sad"] { animation: shake .4s ease; }
        .mascot[data-mood="load"] .tail { animation: wag .5s ease-in-out infinite alternate; }
        .mascot .tail { transform-origin: 98px 92px; }

        @keyframes hop { 50% { transform: translateY(-14px) rotate(-4deg); } }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @keyframes wag { to { transform: rotate(18deg); } }

        .title h1 {
            font-family: 'Bagel Fat One', cursive;
            font-weight: 400;
            font-size: clamp(2rem, 6vw, 3.4rem);
            line-height: 1.05;
            color: var(--ink);
            text-shadow: 3px 3px 0 var(--pink);
        }

        .title h1 span { display: inline-block; }
        .title p { font-weight: 700; margin-top: 8px; }
        .title .tag {
            display: inline-block;
            background: var(--mint);
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 0 10px;
            font-size: .9rem;
            margin-top: 10px;
            transform: rotate(-2deg);
        }

        /* satu momen masuk: judul memantul sekali */
        .title h1 span { animation: letter .6s cubic-bezier(.3,1.6,.5,1) both; }
        @keyframes letter { from { transform: translateY(26px) scale(.6); opacity: 0; } }

        /* ---------- layout ---------- */
        .layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 32px;
            align-items: start;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input, textarea {
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 14px;
            padding: 10px 14px;
        }

        input::placeholder, textarea::placeholder { color: #7b86b8; }
        textarea { min-height: 150px; resize: vertical; }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 4px var(--lemon); }

        .toolbar input { flex: 1; min-width: 180px; }

        .btn {
            font-family: 'Bagel Fat One', cursive;
            font-size: 1.05rem;
            color: var(--ink);
            background: var(--pink);
            border: 3px solid var(--ink);
            border-radius: 14px;
            padding: 8px 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform .1s, box-shadow .1s;
        }

        .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
        .btn.alt { background: var(--lilac); }
        .btn:disabled { opacity: .6; cursor: wait; }

        /* ---------- kartu post ---------- */
        #postList { list-style: none; display: grid; gap: 22px; }

        .post {
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 20px;
            box-shadow: 6px 6px 0 var(--c, var(--lemon));
            overflow: hidden;
        }

        .post:nth-child(odd) { transform: rotate(-.6deg); }
        .post:nth-child(even) { transform: rotate(.5deg); }

        .post-head {
            all: unset;
            box-sizing: border-box;
            display: flex;
            width: 100%;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            cursor: pointer;
        }

        .avatar {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-family: 'Bagel Fat One', cursive;
            font-size: 1.3rem;
            background: var(--c, var(--lemon));
            border: 3px solid var(--ink);
            border-radius: 50%;
        }

        .post-info { flex: 1; min-width: 0; }
        .post-info h3 { font-size: 1.15rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
        .post-info small { font-size: .85rem; font-weight: 600; opacity: .75; }

        .chev { transition: transform .25s cubic-bezier(.3,1.6,.5,1); font-size: 1.2rem; }
        .post.open .chev { transform: rotate(180deg); }

        .post-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .3s ease;
        }
        .post.open .post-body { grid-template-rows: 1fr; }
        .post-body > div { overflow: hidden; }

        .post-body .text {
            padding: 4px 18px 6px 78px;
            max-width: 62ch;
            font-size: 1.02rem;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .post-body .text.none { font-style: italic; opacity: .6; }

        .actions { display: flex; align-items: center; gap: 12px; padding: 10px 18px 16px 78px; }

        .like {
            font: inherit;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            color: var(--ink);
            background: #fff;
            border: 2.5px solid var(--ink);
            border-radius: 999px;
            cursor: pointer;
        }

        .like .heart { display: inline-block; font-size: 1.1rem; color: #b8c0e6; transition: color .15s; }
        .like.on { background: var(--pink); }
        .like.on .heart { color: var(--danger); animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
        @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }

        .time { font-size: .85rem; font-weight: 600; opacity: .7; }

        /* ---------- skeleton & kosong ---------- */
        .skeleton {
            height: 76px;
            border: 3px dashed var(--ink);
            border-radius: 20px;
            background: linear-gradient(100deg, rgba(255,255,255,.5) 30%, #fff 50%, rgba(255,255,255,.5) 70%);
            background-size: 250% 100%;
            animation: shimmer 1.2s linear infinite;
        }
        @keyframes shimmer { to { background-position: -150% 0; } }

        .state {
            background: #fff;
            border: 3px dashed var(--ink);
            border-radius: 20px;
            padding: 28px 22px;
            text-align: center;
            font-weight: 700;
        }
        .state b { display: block; font-family: 'Bagel Fat One', cursive; font-weight: 400; font-size: 1.3rem; margin-bottom: 4px; }
        .state code { background: var(--lemon); border-radius: 6px; padding: 1px 6px; }

        /* ---------- sisi tulis ---------- */
        aside { position: sticky; top: 20px; display: grid; gap: 18px; }

        .note {
            position: relative;
            background: var(--lemon);
            border: 3px solid var(--ink);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 26px 20px 20px;
            transform: rotate(.8deg);
        }

        .note::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            width: 90px;
            height: 26px;
            transform: translateX(-50%) rotate(-3deg);
            background: repeating-linear-gradient(45deg, var(--pink) 0 8px, #ffc4dc 8px 16px);
            border: 2px solid var(--ink);
            border-radius: 4px;
            opacity: .95;
        }

        .note h2 { font-family: 'Bagel Fat One', cursive; font-weight: 400; font-size: 1.5rem; margin-bottom: 12px; }
        .note label { display: block; font-weight: 800; font-size: .92rem; margin: 0 0 4px; }
        .note .field { margin-bottom: 12px; }
        .count { font-size: .8rem; font-weight: 700; text-align: right; margin-top: 2px; }
        .count.warn { color: #c2253a; }

        details.token {
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 16px;
            padding: 12px 16px;
        }
        details.token summary { cursor: pointer; font-weight: 800; }
        details.token p { font-size: .88rem; margin: 8px 0; }

        /* ---------- toast ---------- */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 140%) rotate(-1deg);
            max-width: min(92vw, 460px);
            padding: 12px 20px;
            font-weight: 800;
            background: var(--mint);
            border: 3px solid var(--ink);
            border-radius: 14px;
            box-shadow: var(--shadow);
            transition: transform .4s cubic-bezier(.3,1.5,.5,1);
            z-index: 10;
        }
        #toast.show { transform: translate(-50%, 0) rotate(-1deg); }
        #toast.error { background: #ffc0c7; }

        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            aside { position: static; order: -1; }
            header { flex-direction: column; text-align: center; }
            .post-body .text, .actions { padding-left: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <svg class="mascot" id="mascot" data-mood="idle" viewBox="0 0 130 120" aria-hidden="true">
                <path class="tail body" d="M98 92 C122 92 126 66 112 60" />
                <path class="body" d="M30 40 L26 8 L54 26 Z M76 26 L104 8 L100 40 Z" />
                <ellipse class="body" cx="65" cy="72" rx="48" ry="40" />
                <circle class="cheek" cx="30" cy="82" r="8" opacity=".85" />
                <circle class="cheek" cx="100" cy="82" r="8" opacity=".85" />
                <circle class="eye" cx="46" cy="64" r="11" />
                <circle class="eye" cx="84" cy="64" r="11" />
                <circle class="pupil" id="pupilL" cx="46" cy="64" r="5" />
                <circle class="pupil" id="pupilR" cx="84" cy="64" r="5" />
                <path class="mouth m-idle" d="M56 86 Q65 94 74 86" />
                <path class="mouth m-happy" d="M52 82 Q65 102 78 82" />
                <path class="mouth m-sad" d="M56 94 Q65 84 74 94" />
                <ellipse class="mouth m-load" cx="65" cy="90" rx="5" ry="6" />
            </svg>
            <div class="title">
                <h1 id="logo">Jurnal Kecil</h1>
                <p>Tulisan-tulisan dari API Laravel kamu.</p>
                <span class="tag">Modul Laravel, Chapter 9</span>
            </div>
        </header>

        <div class="layout">
            <main>
                <div class="toolbar">
                    <input id="search" type="search" placeholder="Cari judul post..." aria-label="Cari judul post">
                    <button id="loadButton" class="btn alt">Muat ulang</button>
                </div>
                <ul id="postList" aria-live="polite"></ul>
            </main>

            <aside>
                <details class="token">
                    <summary>Token Sanctum</summary>
                    <p>Dipakai hanya untuk membuat post baru.</p>
                    <input id="token" type="password" placeholder="Tempel token di sini" autocomplete="off">
                </details>

                <div class="note">
                    <h2>Tulis post baru</h2>
                    <form id="postForm">
                        <div class="field">
                            <label for="title">Judul</label>
                            <input id="title" type="text" maxlength="120" placeholder="Judul yang bikin penasaran" required>
                        </div>
                        <div class="field">
                            <label for="content">Isi</label>
                            <textarea id="content" placeholder="Ceritakan sesuatu..." required></textarea>
                            <div class="count" id="count">0 kata</div>
                        </div>
                        <button type="submit" class="btn" id="saveButton">Simpan post</button>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" role="status"></div>

    <script>
        const API = 'http://127.0.0.1:8000/api/posts';
        const colors = ['#ffd84d', '#ff9ec4', '#8fe3bf', '#c9b8ff'];

        const postList = document.getElementById('postList');
        const tokenInput = document.getElementById('token');
        const searchInput = document.getElementById('search');
        const mascot = document.getElementById('mascot');
        const toastEl = document.getElementById('toast');
        const loadButton = document.getElementById('loadButton');
        const saveButton = document.getElementById('saveButton');

        let posts = [];
        let likes = {};
        try { likes = JSON.parse(localStorage.getItem('likes') || '{}'); } catch (e) { }

        /* judul: huruf muncul satu per satu */
        const logo = document.getElementById('logo');
        logo.innerHTML = [...logo.textContent].map((ch, i) =>
            '<span style="animation-delay:' + (i * 55) + 'ms">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>').join('');

        /* mata maskot mengikuti kursor */
        const pupils = [
            { el: document.getElementById('pupilL'), x: 46, y: 64 },
            { el: document.getElementById('pupilR'), x: 84, y: 64 }
        ];
        window.addEventListener('pointermove', (e) => {
            const r = mascot.getBoundingClientRect();
            const dx = e.clientX - (r.left + r.width / 2);
            const dy = e.clientY - (r.top + r.height / 2);
            const d = Math.hypot(dx, dy) || 1;
            const k = Math.min(4, d / 40);
            pupils.forEach(p => {
                p.el.setAttribute('cx', p.x + (dx / d) * k);
                p.el.setAttribute('cy', p.y + (dy / d) * k);
            });
        });

        let moodTimer;
        function setMood(mood, back = true) {
            mascot.setAttribute('data-mood', mood);
            clearTimeout(moodTimer);
            if (back && mood !== 'idle') moodTimer = setTimeout(() => mascot.setAttribute('data-mood', 'idle'), 2200);
        }

        let toastTimer;
        function toast(text, type = 'ok') {
            toastEl.textContent = text;
            toastEl.className = 'show ' + (type === 'error' ? 'error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function readingTime(text) {
            const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
            return Math.max(1, Math.round(words / 200));
        }

        function showState(title, html) {
            postList.innerHTML = '<li class="state"><b>' + title + '</b>' + html + '</li>';
        }

        function render() {
            const q = searchInput.value.trim().toLowerCase();
            const list = posts.filter(p => String(p.title).toLowerCase().includes(q));

            if (posts.length === 0) {
                showState('Belum ada post', 'Tulis post pertamamu lewat form di samping.');
                return;
            }
            if (list.length === 0) {
                showState('Tidak ketemu', 'Tidak ada judul yang cocok dengan "' + escapeHtml(searchInput.value) + '". Coba kata lain.');
                return;
            }

            postList.innerHTML = '';
            list.forEach((post, i) => {
                const key = post.id ?? post.title;
                const author = post.author ?? 'Tanpa penulis';
                const body = post.content ? escapeHtml(post.content) : '';
                const li = document.createElement('li');
                li.className = 'post';
                li.style.setProperty('--c', colors[i % colors.length]);
                li.innerHTML =
                    '<button class="post-head" aria-expanded="false">' +
                        '<span class="avatar">' + escapeHtml(String(author).charAt(0).toUpperCase()) + '</span>' +
                        '<span class="post-info"><h3>' + escapeHtml(post.title) + '</h3>' +
                        '<small>Ditulis oleh ' + escapeHtml(author) + '</small></span>' +
                        '<span class="chev" aria-hidden="true">▾</span>' +
                    '</button>' +
                    '<div class="post-body"><div>' +
                        '<p class="text' + (body ? '' : ' none') + '">' + (body || 'Post ini belum punya isi.') + '</p>' +
                        '<div class="actions">' +
                            '<button class="like' + (likes[key] ? ' on' : '') + '" aria-pressed="' + !!likes[key] + '">' +
                            '<span class="heart">♥</span><span class="n">' + (likes[key] ? 'Disukai' : 'Suka') + '</span></button>' +
                            (body ? '<span class="time">Baca sekitar ' + readingTime(post.content) + ' menit</span>' : '') +
                        '</div>' +
                    '</div></div>';

                const head = li.querySelector('.post-head');
                head.addEventListener('click', () => {
                    const open = li.classList.toggle('open');
                    head.setAttribute('aria-expanded', open);
                });

                const likeBtn = li.querySelector('.like');
                likeBtn.addEventListener('click', () => {
                    likes[key] = !likes[key];
                    try { localStorage.setItem('likes', JSON.stringify(likes)); } catch (e) { }
                    likeBtn.classList.toggle('on', likes[key]);
                    likeBtn.setAttribute('aria-pressed', likes[key]);
                    likeBtn.querySelector('.n').textContent = likes[key] ? 'Disukai' : 'Suka';
                    if (likes[key]) setMood('happy');
                });

                postList.appendChild(li);
            });
        }

        async function loadPosts() {
            loadButton.disabled = true;
            setMood('load', false);
            postList.innerHTML = '<li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>';
            try {
                const response = await fetch(API, { headers: { 'Accept': 'application/json' } });
                if (!response.ok) {
                    throw new Error('Gagal mengambil data post (HTTP ' + response.status + ').');
                }
                const json = await response.json();
                posts = Array.isArray(json) ? json : (json.data ?? []);
                render();
                setMood('happy');
            } catch (error) {
                posts = [];
                setMood('sad');
                if (error instanceof TypeError) {
                    showState('Server belum nyala',
                        'Jalankan <code>php artisan serve</code> dulu, lalu klik Muat ulang.');
                } else {
                    showState('Ada masalah', escapeHtml(error.message));
                }
            } finally {
                loadButton.disabled = false;
            }
        }

        searchInput.addEventListener('input', render);
        loadButton.addEventListener('click', loadPosts);

        /* penghitung kata di form */
        const contentInput = document.getElementById('content');
        const count = document.getElementById('count');
        contentInput.addEventListener('input', () => {
            const n = contentInput.value.trim().split(/\s+/).filter(Boolean).length;
            count.textContent = n + ' kata';
        });

        document.getElementById('postForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = {
                title: document.getElementById('title').value,
                content: contentInput.value
            };
            saveButton.disabled = true;
            saveButton.textContent = 'Menyimpan...';
            setMood('load', false);
            try {
                const response = await fetch(API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': 'Bearer ' + tokenInput.value
                    },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || 'Post gagal disimpan.');
                }
                toast('Post berhasil disimpan');
                document.getElementById('postForm').reset();
                count.textContent = '0 kata';
                await loadPosts();
            } catch (error) {
                setMood('sad');
                toast(error instanceof TypeError ? 'Server tidak bisa dihubungi.' : error.message, 'error');
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Simpan post';
            }
        });

        loadPosts();
    </script>
</body>

</html>
